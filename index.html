<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Проверка</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .box{text-align:center}
    button{font-size:28px;font-weight:800;padding:18px 34px;border:0;border-radius:18px;background:#fff;color:#111}
    #msg{margin-top:24px;font-size:32px;font-weight:800;min-height:40px}
  </style>
</head>
<body>
  <div class="box">
    <button id="helloBtn">Привет</button>
    <div id="msg"></div>
  </div>
  <script>
    document.getElementById('helloBtn').addEventListener('click', () => {
      document.getElementById('msg').textContent = 'Пока';
    });
  </script>
</body>
</html>
